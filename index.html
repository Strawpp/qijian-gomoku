<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="从截图接手五子棋棋局，在浏览器里分析落点或继续对弈。">
  <title>棋间 · 五子棋分析</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23294339'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23f2e9d7'/%3E%3Ccircle cx='21' cy='21' r='4' fill='%23d6b58b'/%3E%3C/svg%3E">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-width header-inner">
      <a class="wordmark" href="./" aria-label="棋间首页"><span class="brand-icon" aria-hidden="true"></span>棋间</a>
      <span class="local-label"><i aria-hidden="true"></i>浏览器本地分析</span>
    </div>
  </header>
  <main class="site-width">
    <div class="page-top">
      <div>
        <h1>五子棋分析</h1>
        <p>从一张截图接手棋局，或从空盘开始。</p>
      </div>
      <div class="import-actions">
        <button id="upload" class="button primary" type="button"><span class="upload-icon" aria-hidden="true">↑</span>导入截图</button>
        <button id="setup" class="button secondary" type="button">手动摆盘</button>
        <input id="image-file" type="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="workbench">
      <section class="board-card surface" aria-label="五子棋棋盘">
        <div class="board-header">
          <h2>棋盘</h2>
          <span>15 路 · 自由规则</span>
        </div>
        <div id="board-frame" class="board-frame">
          <canvas id="board" tabindex="0" aria-label="15 路棋盘。使用方向键选点，回车或空格预览或摆棋。"></canvas>
        </div>
        <div class="board-footer">
          <div class="legend"><span><i class="stone black"></i><b id="black-count">0</b></span><span><i class="stone white"></i><b id="white-count">0</b></span></div>
          <button id="example" class="text-button" type="button">试用示例</button>
          <button id="reference" class="text-button" type="button" hidden>查看原图</button>
        </div>
      </section>
      <div class="side-panel">
        <section class="surface play-card" aria-label="棋局操作">
          <div id="play-controls">
            <div class="segmented" id="mode" aria-label="使用模式">
              <button type="button" data-mode="follow" aria-pressed="true">好友跟盘</button>
              <button type="button" data-mode="engine" aria-pressed="false">人机对弈</button>
            </div>
            <div class="role-row">
              <span>我的执棋</span>
              <div class="color-switch" id="play-color" aria-label="我的执棋">
                <button type="button" data-color="1" aria-pressed="true"><i class="stone black"></i>黑棋</button>
                <button type="button" data-color="2" aria-pressed="false"><i class="stone white"></i>白棋</button>
              </div>
            </div>
            <div class="turn-card" aria-live="polite">
              <span id="turn-label" class="turn-label"></span>
              <h2 id="turn-title"></h2>
              <p id="turn-detail"></p>
            </div>
            <div class="move-actions">
              <button id="confirm" class="button primary" type="button">确认落子</button>
              <button id="adopt" class="button primary" type="button" hidden>已按推荐下</button>
              <button id="cancel-preview" class="button secondary" type="button" hidden>取消选点</button>
              <button id="deeper" class="button secondary" type="button" hidden>继续分析</button>
            </div>
          </div>
          <div id="edit-controls" hidden>
            <div class="edit-heading"><h2 id="edit-title">手动摆盘</h2><p id="edit-detail">点棋盘摆棋，设置下一手后继续。</p></div>
            <div class="tool-buttons" id="edit-tool" aria-label="摆盘工具">
              <button type="button" data-tool="1" aria-pressed="true"><i class="stone black"></i>放黑棋</button>
              <button type="button" data-tool="2" aria-pressed="false"><i class="stone white"></i>放白棋</button>
              <button type="button" data-tool="0" aria-pressed="false">擦除</button>
            </div>
            <div class="edit-options">
              <label for="edit-next">下一手</label>
              <select id="edit-next"><option value="1">黑棋</option><option value="2">白棋</option></select>
              <label for="edit-color">我的执棋</label>
              <select id="edit-color"><option value="1">黑棋</option><option value="2">白棋</option></select>
              <label for="edit-mode">继续方式</label>
              <select id="edit-mode"><option value="follow">好友跟盘</option><option value="engine">人机对弈</option></select>
            </div>
            <p id="edit-note" class="edit-note" aria-live="polite"></p>
            <div class="move-actions">
              <button id="save-edit" class="button primary" type="button">从此局面继续</button>
              <button id="cancel-edit" class="button secondary" type="button">取消</button>
            </div>
            <div class="edit-links">
              <button id="clear-board" class="text-button" type="button">清空摆盘</button>
              <button id="align" class="text-button" type="button" hidden>手动定位棋盘</button>
            </div>
          </div>
        </section>
        <section id="record-card" class="surface record-card" aria-label="落子记录">
          <div class="record-header"><h2>落子记录</h2><span id="record-count">0 手</span></div>
          <ol id="moves" class="moves"></ol>
          <div class="record-actions">
            <button id="undo" class="button secondary" type="button" disabled><span aria-hidden="true">↶</span>悔一步</button>
            <button id="undo-round" class="button secondary" type="button" hidden>悔一轮</button>
            <button id="correct" class="text-button" type="button">校正棋盘</button>
          </div>
          <button id="restore" class="text-button restore-button" type="button" hidden>返回上一个局面</button>
        </section>
      </div>
    </div>
    <footer class="site-footer">图片在本地处理，棋局自动保存。 <a href="./vendor/rapfi/NOTICE.txt">棋力引擎 Rapfi</a></footer>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="photo-dialog">
    <div class="dialog-header">
      <h2 id="photo-title">核对截图</h2>
      <button id="close-photo" class="icon-button" type="button" aria-label="关闭截图">×</button>
    </div>
    <p id="photo-detail"></p>
    <div id="photo-stage" class="photo-stage"><canvas id="photo" aria-label="截图预览"></canvas></div>
    <div class="dialog-actions">
      <button id="reset-corners" class="button secondary" type="button" hidden>重新选点</button>
      <button id="apply-corners" class="button primary" type="button" hidden>识别棋子</button>
    </div>
  </dialog>
</body>
</html>
